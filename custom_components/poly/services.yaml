reboot:
  target: &speakerphone
    device:
      integration: poly

dial:
  target: *speakerphone
  fields:
    number:
      required: true
      example: "1002"
      selector:
        text:
    line:
      required: false
      selector:
        number:
          min: 1
          max: 24
          mode: box

answer_call:
  target: *speakerphone

reject_call:
  target: *speakerphone

end_call:
  target: *speakerphone
