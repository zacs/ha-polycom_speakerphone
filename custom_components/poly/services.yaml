reboot:
  fields:
    device_id: &device_id
      required: false
      selector:
        device:
          integration: poly

dial:
  fields:
    device_id: *device_id
    number:
      required: true
      example: "1002"
      selector:
        text:
    line:
      required: false
      selector:
        number:
          min: 1
          max: 24
          mode: box

answer_call:
  fields:
    device_id: *device_id

reject_call:
  fields:
    device_id: *device_id

end_call:
  fields:
    device_id: *device_id
